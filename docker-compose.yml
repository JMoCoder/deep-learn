services:
  server:
    build:
      context: .
      target: server
    environment:
      QUANTUM_HOST: "0.0.0.0"
      QUANTUM_PORT: "43128"
      QUANTUM_DATA_DIR: /data
    volumes:
      - quantum-data:/data
    ports:
      - "43128:43128"
      - "43127:80"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:43128/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12

  web:
    build:
      context: .
      target: web
    # Share the server netns so /api works even when the Docker
    # bridge drops inter-container packets (common on nested VMs).
    network_mode: service:server
    depends_on:
      server:
        condition: service_healthy

volumes:
  quantum-data:
